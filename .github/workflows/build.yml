name: Build YouTube Miuix Nav Bar Module

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Validate APKs
      run: |
        DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
        RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
        test -s "$DEBUG_APK" || { echo "::error::debug APK missing or empty"; exit 1; }
        test -s "$RELEASE_APK" || { echo "::error::release APK missing or empty"; exit 1; }
        ls -la "$DEBUG_APK" "$RELEASE_APK"
        unzip -l "$DEBUG_APK" | grep -q "AndroidManifest.xml" || { echo "::error::manifest missing"; exit 1; }
        unzip -l "$DEBUG_APK" | grep -q "classes.dex" || { echo "::error::dex missing"; exit 1; }
        unzip -l "$DEBUG_APK" | grep -q "assets/xposed_init" || { echo "::error::xposed_init missing"; exit 1; }
        unzip -l "$RELEASE_APK" | grep -q "assets/xposed_init" || { echo "::error::release xposed_init missing"; exit 1; }
        echo "APK validation passed"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: youtube-miuix-nav-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: youtube-miuix-nav-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
